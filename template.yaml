AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CFP and speaker toolkit - Serverless infrastructure

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs22.x
    MemorySize: 256
    Environment:
      Variables:
        EVENTS_TABLE: !Ref EventsTable
        SPEAKERS_TABLE: !Ref SpeakersTable
        SPEAKER_ADMIN_TABLE: !Ref SpeakerAdminTable
        CFPS_TABLE: !Ref CfpsTable
        QUESTION_TEMPLATES_TABLE: !Ref QuestionTemplatesTable
        SUBMISSIONS_TABLE: !Ref SubmissionsTable
        SUBMISSION_REVIEWS_TABLE: !Ref SubmissionReviewsTable
        BOOKINGS_TABLE: !Ref BookingsTable
        HEADSHOTS_BUCKET: !Ref HeadshotsBucket
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        REGION: !Ref AWS::Region

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment name

  AppName:
    Type: String
    Default: Speaker Toolkit
    Description: Product name used in the sign-up verification email. Keep in step with APP_NAME in frontend/src/config/app.ts.

  AllowedOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Origin of the web app (for example the Amplify domain). Used for API and S3 CORS.

Resources:
  # ---------------------------------------------------------------------------
  # Cognito
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-user-pool
      AutoVerifiedAttributes:
        - email
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: !Sub '${AppName}: your 6-digit code'
        EmailMessage: !Sub |-
          Your ${AppName} code is {####}

          Go back to the ${AppName} sign-up page and enter this code to finish creating your account. If you didn't sign up, you can ignore this email.
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub ${AWS::StackName}-client
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: Organisers who manage events, CFPs, speakers and bookings
      UserPoolId: !Ref UserPool

  SpeakerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: speaker
      Description: Speakers who maintain a profile and submit to CFPs
      UserPoolId: !Ref UserPool

  # ---------------------------------------------------------------------------
  # DynamoDB tables
  # ---------------------------------------------------------------------------
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: startDateTime
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusDateIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: startDateTime
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  SpeakersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-speakers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: speakerId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: speakerId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # Admin-only: marker and admin notes. Speaker-facing functions have no access.
  SpeakerAdminTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-speaker-admin
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: speakerId
          AttributeType: S
      KeySchema:
        - AttributeName: speakerId
          KeyType: HASH

  CfpsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-cfps
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cfpId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: closesAt
          AttributeType: S
      KeySchema:
        - AttributeName: cfpId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: closesAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  QuestionTemplatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-question-templates
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: templateId
          AttributeType: S
      KeySchema:
        - AttributeName: templateId
          KeyType: HASH

  SubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-submissions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: submissionId
          AttributeType: S
        - AttributeName: cfpId
          AttributeType: S
        - AttributeName: speakerId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: submissionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CfpIndex
          KeySchema:
            - AttributeName: cfpId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: SpeakerIndex
          KeySchema:
            - AttributeName: speakerId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Admin-only: ratings and review notes. Speaker-facing functions have no access.
  SubmissionReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-submission-reviews
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: submissionId
          AttributeType: S
        - AttributeName: adminUserId
          AttributeType: S
      KeySchema:
        - AttributeName: submissionId
          KeyType: HASH
        - AttributeName: adminUserId
          KeyType: RANGE

  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-bookings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bookingId
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: speakerId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: bookingId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EventIndex
          KeySchema:
            - AttributeName: eventId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: SpeakerIndex
          KeySchema:
            - AttributeName: speakerId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ---------------------------------------------------------------------------
  # S3 (private headshots, accessed via presigned URLs only)
  # ---------------------------------------------------------------------------
  HeadshotsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AllowedOrigin
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedHeaders:
              - '*'
            MaxAge: 600

  # ---------------------------------------------------------------------------
  # Lambda functions
  # ---------------------------------------------------------------------------

  # Cognito trigger: adds every self-signed-up user to the speaker group.
  # The pool ARN is built from a wildcard to avoid a circular dependency with UserPool.
  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - handlers/post-confirmation.ts
    Properties:
      FunctionName: !Sub ${AWS::StackName}-post-confirmation
      CodeUri: src/
      Handler: handlers/post-confirmation.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminAddUserToGroup
              Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  PostConfirmationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PostConfirmationFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  # /me identity, account deletion, admin user management
  UsersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - handlers/users.ts
    Properties:
      FunctionName: !Sub ${AWS::StackName}-users
      CodeUri: src/
      Handler: handlers/users.handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminGetUser
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
              Resource: !GetAtt UserPool.Arn
        # Account deletion (DELETE /me) removes the caller's data across tables.
        - DynamoDBCrudPolicy:
            TableName: !Ref SpeakersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SpeakerAdminTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionReviewsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - S3CrudPolicy:
            BucketName: !Ref HeadshotsBucket
      Events:
        GetMe:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /me
            Method: get
        DeleteMe:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /me
            Method: delete
        ListUsers:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/users
            Method: get
        InviteUser:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/users/invite
            Method: post
        PromoteUser:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/users/{userId}/promote
            Method: post
        DemoteUser:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/users/{userId}/demote
            Method: post

  # Admin event CRUD
  EventsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - handlers/events.ts
    Properties:
      FunctionName: !Sub ${AWS::StackName}-events
      CodeUri: src/
      Handler: handlers/events.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        # Event deletion cascades to bookings (CFPs are not tied to events)
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
      Events:
        ListEvents:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/events
            Method: get
        CreateEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/events
            Method: post
        GetEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/events/{id}
            Method: get
        UpdateEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/events/{id}
            Method: put
        DeleteEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/events/{id}
            Method: delete

  # Speaker-facing profile. No access to SpeakerAdminTable or SubmissionReviewsTable.
  SpeakersMeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - handlers/speakers-me.ts
    Properties:
      FunctionName: !Sub ${AWS::StackName}-speakers-me
      CodeUri: src/
      Handler: handlers/speakers-me.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SpeakersTable
        - S3CrudPolicy:
            BucketName: !Ref HeadshotsBucket
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /me/profile
            Method: get
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /me/profile
            Method: put
        HeadshotUrl:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /me/profile/headshot-url
            Method: post

  # Admin speaker directory, markers and notes
  SpeakersAdminFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - handlers/speakers-admin.ts
    Properties:
      FunctionName: !Sub ${AWS::StackName}-speakers-admin
      CodeUri: src/
      Handler: handlers/speakers-admin.handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SpeakersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SpeakerAdminTable
        - DynamoDBReadPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref BookingsTable
        # Admin headshot upload (presigned POST) and removal of replaced objects
        - S3CrudPolicy:
            BucketName: !Ref HeadshotsBucket
        # Verify the account exists before linking a profile to it
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
      Events:
        ListSpeakers:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/speakers
            Method: get
        CreateSpeaker:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/speakers
            Method: post
        GetSpeaker:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/speakers/{id}
            Method: get
        UpdateSpeaker:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/speakers/{id}
            Method: put
        SetMarker:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/speakers/{id}/marker
            Method: put
        SetNotes:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/speakers/{id}/notes
            Method: put
        LinkSpeaker:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/speakers/{id}/link
            Method: post
        SpeakerHeadshotUrl:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/speakers/{id}/headshot-url
            Method: post

  # CFP management (admin) and open CFP list/detail (speaker)
  CfpsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - handlers/cfps.ts
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cfps
      CodeUri: src/
      Handler: handlers/cfps.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CfpsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref QuestionTemplatesTable
        - DynamoDBReadPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        ListCfps:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/cfps
            Method: get
        CreateCfp:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/cfps
            Method: post
        GetCfp:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/cfps/{id}
            Method: get
        UpdateCfp:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/cfps/{id}
            Method: put
        DeleteCfp:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/cfps/{id}
            Method: delete
        DuplicateCfp:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/cfps/{id}/duplicate
            Method: post
        ReplaceQuestions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/cfps/{id}/questions
            Method: put
        ApplyTemplate:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/cfps/{id}/apply-template
            Method: post
        ListTemplates:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/templates
            Method: get
        CreateTemplate:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/templates
            Method: post
        DeleteTemplate:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/templates/{id}
            Method: delete
        ListOpenCfps:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /me/cfps
            Method: get
        GetOpenCfp:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /me/cfps/{id}
            Method: get

  # Speaker-facing submissions. No access to SpeakerAdminTable or SubmissionReviewsTable.
  SubmissionsMeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - handlers/submissions-me.ts
    Properties:
      FunctionName: !Sub ${AWS::StackName}-submissions-me
      CodeUri: src/
      Handler: handlers/submissions-me.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref CfpsTable
        - DynamoDBReadPolicy:
            TableName: !Ref SpeakersTable
      Events:
        ListMySubmissions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /me/submissions
            Method: get
        CreateMySubmission:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /me/submissions
            Method: post
        GetMySubmission:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /me/submissions/{id}
            Method: get
        UpdateMySubmission:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /me/submissions/{id}
            Method: put
        WithdrawMySubmission:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /me/submissions/{id}
            Method: delete
        SubmitMySubmission:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /me/submissions/{id}/submit
            Method: post

  # Admin review of submissions, ratings and status changes
  SubmissionsAdminFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - handlers/submissions-admin.ts
    Properties:
      FunctionName: !Sub ${AWS::StackName}-submissions-admin
      CodeUri: src/
      Handler: handlers/submissions-admin.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionReviewsTable
        - DynamoDBReadPolicy:
            TableName: !Ref CfpsTable
        - DynamoDBReadPolicy:
            TableName: !Ref SpeakersTable
        - DynamoDBReadPolicy:
            TableName: !Ref SpeakerAdminTable
      Events:
        ListCfpSubmissions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/cfps/{id}/submissions
            Method: get
        GetSubmission:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/submissions/{id}
            Method: get
        SetSubmissionStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/submissions/{id}/status
            Method: put
        SetSubmissionReview:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/submissions/{id}/review
            Method: put

  # Admin bookings and the speaker's confirmed-only view
  BookingsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - handlers/bookings.ts
    Properties:
      FunctionName: !Sub ${AWS::StackName}-bookings
      CodeUri: src/
      Handler: handlers/bookings.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref SpeakersTable
        # Validates that a booking's submissionId exists and belongs to the speaker
        - DynamoDBReadPolicy:
            TableName: !Ref SubmissionsTable
        # Needed for the SPEAKER_NOT_AGAIN warning on admin booking creation
        - DynamoDBReadPolicy:
            TableName: !Ref SpeakerAdminTable
      Events:
        ListBookings:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/bookings
            Method: get
        CreateBooking:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/bookings
            Method: post
        UpdateBooking:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/bookings/{id}
            Method: put
        DeleteBooking:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/bookings/{id}
            Method: delete
        ListMyBookings:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /me/bookings
            Method: get

  # ---------------------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------------------
  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-api
      RetentionInDays: 14

  # IAM Role for API Gateway to write to CloudWatch
  ApiGatewayLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  # API Gateway Account configuration for logging
  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayLoggingRole.Arn

  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${AWS::StackName}-api
      StageName: !Ref Environment
      # Enable execution logging
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
      # Enable access logging
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '{"requestId":"$context.requestId","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","error.message":"$context.error.message","error.messageString":"$context.error.messageString","authorizer.error":"$context.authorizer.error","authorizer.status":"$context.authorizer.status","integration.error":"$context.integration.error","integration.status":"$context.integration.status","responseLength":"$context.responseLength","responseTime":"$context.responseTime","sourceIp":"$context.identity.sourceIp","userAgent":"$context.identity.userAgent"}'
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
        AllowCredentials: false
        MaxAge: "'600'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

Outputs:
  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ${AWS::StackName}-api-url

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub ${AWS::StackName}-user-pool-id

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub ${AWS::StackName}-user-pool-client-id

  HeadshotsBucketName:
    Description: Private S3 bucket for speaker headshots
    Value: !Ref HeadshotsBucket
    Export:
      Name: !Sub ${AWS::StackName}-headshots-bucket
